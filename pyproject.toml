[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "aeroco2"
version = "0.1.0"
description = "Aircraft CO2 emission calculation tool"
requires-python = ">=3.10"
dependencies = [
    "pandas",
    "openap",
]

[tool.setuptools.packages.find]
where = ["src"]
